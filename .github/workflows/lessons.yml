name: Refresh lessons data
on:
  schedule:
    - cron: '15 3 * * *'   # daily 06:15 Israel time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build_lessons.py
      - name: Commit updated data
        run: |
          git config user.name "aleh-hadas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/lessons.json data/spotify-map.json
          git diff --cached --quiet || git commit -m "Daily lessons refresh"
          git push
