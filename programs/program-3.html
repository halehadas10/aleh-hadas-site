<style>
  body { background: #fff; }
  .prog-wrap { max-width: 980px; margin: 0 auto; padding: 34px 20px 70px; }
  .prog-back { display: inline-block; margin-bottom: 18px; }
  .prog-title { margin: 0 0 8px; }
  .prog-kicker { color: var(--text-dim); margin: 0 0 26px; font-size: 1.05rem; }
  .prog-carousel { position: relative; border-radius: 20px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,80,110,.16); background: #0b2a3a; }
  .prog-track { position: relative; aspect-ratio: 16 / 9; }
  .prog-slide { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; }
  .prog-slide.is-on { opacity: 1; }
  .prog-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .prog-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%;
    border: none; background: rgba(255,255,255,.92); color: #00506e; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.25); transition: background .2s, transform .2s; z-index: 2; }
  .prog-arrow:hover { background: #fff; transform: translateY(-50%) scale(1.07); }
  .prog-arrow svg { width: 22px; height: 22px; }
  .prog-prev { inset-inline-start: 14px; }
  .prog-next { inset-inline-end: 14px; }
  .prog-dots { position: absolute; bottom: 12px; inset-inline: 0; display: flex; gap: 8px; justify-content: center; z-index: 2; }
  .prog-dot { width: 9px; height: 9px; border-radius: 50%; border: none; background: rgba(255,255,255,.45); cursor: pointer; padding: 0; }
  .prog-dot.is-on { background: #fff; }
  .prog-desc { background: linear-gradient(150deg, #f2f7f5, #ffffff); border: 1px solid rgba(0,80,110,.12); border-radius: 18px;
    padding: 26px 28px; margin: 28px 0 0; font-size: 1.12rem; line-height: 1.9; color: #14323f; }
  .prog-ctas { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 30px; }
  @media (max-width: 640px) {
    .prog-arrow { width: 38px; height: 38px; }
    .prog-desc { padding: 20px; font-size: 1.02rem; }
  }
</style>

<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.prog-slide'));
  var dotsBox = document.getElementById('progDots');
  var n = slides.length, i = 0, timer = null;
  slides.forEach(function (_, k) {
    var d = document.createElement('button');
    d.type = 'button'; d.className = 'prog-dot'; d.setAttribute('aria-label', 'תמונה ' + (k + 1));
    d.addEventListener('click', function () { go(k); restart(); });
    dotsBox.appendChild(d);
  });
  var dots = Array.prototype.slice.call(dotsBox.children);
  function go(k) {
    i = ((k % n) + n) % n;
    slides.forEach(function (s, j) { s.classList.toggle('is-on', j === i); });
    dots.forEach(function (d, j) { d.classList.toggle('is-on', j === i); });
  }
  function next() { go(i + 1); }
  function prev() { go(i - 1); }
  function restart() { if (timer) clearInterval(timer); timer = setInterval(next, 4000); }
  document.querySelector('.prog-next').addEventListener('click', function () { next(); restart(); });
  document.querySelector('.prog-prev').addEventListener('click', function () { prev(); restart(); });
  var box = document.getElementById('progCarousel');
  box.addEventListener('mouseenter', function () { if (timer) clearInterval(timer); timer = null; });
  box.addEventListener('mouseleave', restart);
  go(0); restart();
})();
</script>

<script>
(function () {
  var modal = document.getElementById('talkModal');
  var openBtn = document.getElementById('talkBtn');
  if (!modal || !openBtn) return;
  function open() { modal.hidden = false; requestAnimationFrame(function () { modal.classList.add('is-open'); }); }
  function close() { modal.classList.remove('is-open'); setTimeout(function () { modal.hidden = true; }, 320); }
  openBtn.addEventListener('click', open);
  modal.querySelector('.tm-close').addEventListener('click', close);
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) close(); });
})();
</script>
